<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cote y Lau · Busca tu mesa</title>
    <link rel="stylesheet" href="style.css?v=20260925" />
  </head>
  <body
    class="theme-cote-lau"
    data-view="guest"
    data-event-name="Cote y Lau"
    data-dataset="data/guests-cote-lau.json"
    data-table-map=""
  >
    <div class="backdrop"></div>
    <main class="layout">
      <section class="hero-card invite-card">
        <p class="script-tag">Cote y Lau</p>
        <h1>Busca tu mesa</h1>
        <p class="intro-text">Escribe tu nombre, apellido o mesa y verás solo tu número de mesa.</p>

        <form id="search-form" autocomplete="off">
          <label for="query">Nombre, apellido o mesa</label>
          <input
            id="query"
            name="query"
            type="search"
            placeholder="Ej: Alberto Abauad, mesa 19"
            spellcheck="false"
            autocomplete="off"
            required
          />
          <button type="submit">Busca tu mesa</button>
        </form>
      </section>

      <section class="results-panel">
        <div id="results" aria-live="polite"></div>

        <section class="floorplan-card">
          <h2>Plano de ubicación</h2>
          <p>Plano simplificado para orientarte rápido.</p>
          <div id="floorplan-map" class="floorplan-map" aria-label="Plano simplificado de mesas"></div>
        </section>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>

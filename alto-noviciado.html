<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Busque su mesa · Alto Noviciado</title>
    <link rel="stylesheet" href="style.css?v=20261023" />
  </head>
  <body
    class="theme-noviciado"
    data-dataset="data/guests-alto-noviciado.json"
    data-table-map="data/table-map-50.json"
  >
    <div class="backdrop"></div>
    <main class="layout">
      <section class="hero-card invite-card">
        <p class="event-meta">ALTO NOVICIADO · LISTA DE INVITADOS</p>
        <span class="script-tag">Busque su mesa</span>
        <h1>Encuentra tu mesa</h1>
        <p class="intro-text">Escribe tu nombre, apellido o número de mesa y verás tu ubicación en el salón.</p>
        <form id="search-form" autocomplete="off">
          <label for="query">Nombre, apellido o mesa</label>
          <input
            id="query"
            name="query"
            type="search"
            placeholder="Ej: Francisca Aguilera, mesa 18"
            spellcheck="false"
            autocomplete="off"
            required
          />
          <button type="submit">Buscar mesa</button>
        </form>
      </section>

      <section class="results-panel">
        <div id="results" aria-live="polite">
          <div class="empty">Escribe tu nombre para ver la mesa.</div>
        </div>
        <div class="floorplan-card">
          <h2>Plano Alto Noviciado</h2>
          <p>El marcador se actualizará con la mesa del último resultado.</p>
          <div class="floorplan-frame">
            <img src="assets/noviciado-50mesas.jpg" alt="Plano de mesas Alto Noviciado" />
            <span id="floorplan-highlight" class="floorplan-highlight" hidden>
              <span class="floorplan-tip">Mesa</span>
              <span class="floorplan-ring"><span class="floorplan-number">—</span></span>
            </span>
          </div>
          <a class="floorplan-link" href="assets/noviciado-50mesas.jpg" target="_blank" rel="noopener"
            >Abrir en grande</a
          >
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
